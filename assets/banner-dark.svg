<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="sharing-studio — open-source agent systems hub">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2330" stroke-width="1"/>
    </pattern>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="500" fill="#0a0a0a"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- edges (hub -> three nodes) -->
  <g stroke="url(#edge)" stroke-width="1.5" fill="none" opacity="0.9">
    <line x1="330" y1="250" x2="720" y2="150"/>
    <line x1="330" y1="250" x2="720" y2="250"/>
    <line x1="330" y1="250" x2="720" y2="350"/>
  </g>

  <!-- hub node -->
  <g transform="translate(330 250)">
    <circle r="46" fill="#818cf8" opacity="0.22" filter="url(#soft)"/>
    <circle r="32" fill="#0a0a0a" stroke="#f5f5f5" stroke-width="1.6"/>
    <circle r="5" fill="#818cf8"/>
  </g>

  <!-- three project nodes -->
  <g fill="#0a0a0a" stroke="#f5f5f5" stroke-width="1.4">
    <circle cx="720" cy="150" r="20"/>
    <circle cx="720" cy="250" r="20"/>
    <circle cx="720" cy="350" r="20"/>
  </g>
  <g fill="#818cf8">
    <circle cx="720" cy="150" r="4"/>
    <circle cx="720" cy="250" r="4"/>
    <circle cx="720" cy="350" r="4"/>
  </g>

  <!-- project labels -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans', sans-serif" font-size="17" fill="#e5e7eb">
    <text x="760" y="155">agent-memory-stack</text>
    <text x="760" y="255">second-brain-scaffold</text>
    <text x="760" y="355">gtd-todoist</text>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans', sans-serif" font-size="12" fill="#6b7280">
    <text x="760" y="175">L1 · agent memory across repos</text>
    <text x="760" y="275">L2 · personal knowledge vault</text>
    <text x="760" y="375">task system · Todoist</text>
  </g>

  <!-- title block -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans', sans-serif">
    <text x="120" y="155" font-size="56" font-weight="600" fill="#f5f5f5" letter-spacing="-0.5">sharing-studio</text>
    <text x="120" y="195" font-size="18" fill="#9ca3af">open-source agent systems</text>
    <text x="120" y="220" font-size="14" fill="#6b7280">memory · knowledge · tasks</text>
  </g>

  <!-- bottom rule + tagline -->
  <line x1="120" y1="430" x2="1480" y2="430" stroke="#1f2937" stroke-width="1"/>
  <text x="120" y="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans', sans-serif" font-size="13" fill="#6b7280" letter-spacing="0.5">AGENTS · KNOWLEDGE · SYSTEMS</text>
</svg>
